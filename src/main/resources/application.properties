spring.application.name=employee-leave-managment

spring.datasource.url=jdbc:mysql://localhost:3306/employee_leave_management
spring.datasource.username=root
spring.datasource.password=kiran123@

spring.thymeleaf.cache=false
spring.jpa.hibernate.ddl-auto=none

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoints.web.base-path=/actuator
management.prometheus.metrics.export.enabled=true
server.port=9090

# \u2500\u2500 NEW: idle-session auto-logout \u2500\u2500
# A session with no requests for 10 minutes is invalidated by the servlet
# container. SessionAuditListener records this as a `session_events_total`
# metric with outcome=timeout (as opposed to outcome=logout for someone
# clicking "Logout"). See AppConstants.SESSION_TIMEOUT_MINUTES.
server.servlet.session.timeout=10m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# NOTE (not enabled by default): if you put this app behind a reverse proxy
# / load balancer, uncomment the line below so Spring trusts its
# X-Forwarded-* headers for building redirect URLs. Only do this if the
# proxy is one you control and strips/overwrites any X-Forwarded-* headers
# a client tries to send directly, otherwise it becomes a spoofing vector.
# server.forward-headers-strategy=framework
